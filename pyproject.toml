[project]
name = "kurve"
version = "0.1.0"
description = "An RL racing agent: PPO and SAC on CarRacing-v3, then SAC on Assetto Corsa."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Youssef Hany Samy" }]

# The code is run from the repo root as modules (`python -m src.train ...`), not
# installed as a package. Dependencies live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
